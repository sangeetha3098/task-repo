<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <title>User Profile</title>
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
      <div class="container">
        <a class="navbar-brand fw-bold text-white" href="#"> User Profile </a>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link text-white" href="#"> Home </a>
            </li>

            <li class="nav-item">
              <a class="nav-link text-white" href="#"> Profile </a>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link text-white" href="#" data-bs-toggle="dropdown">
                Account
              </a>

              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Settings</a></li>
                <li><a class="dropdown-item" href="#">Logout</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Profile Section -->
    <div class="container my-5">
      <div class="row g-4">
        <!-- User Details Card -->
        <div class="col-md-4">
          <div class="card shadow text-center">
            <div class="card-body">
              <img
                src="../assets/image/falls.jpg"
                alt="Profile"
                class="rounded-circle mb-3"
                width="80"
                height="80"
              />

              <h4>Reka</h4>

              <p class="text-muted">Frontend Developer</p>

              <button
                class="btn btn-success"
                data-bs-toggle="modal"
                data-bs-target="#editModal"
              >
                Edit Profile
              </button>
            </div>
          </div>
        </div>

        <!-- Edit Form -->
        <div class="col-md-8">
          <div class="card shadow">
            <div class="card-header bg-success text-white">Edit Details</div>

            <div class="card-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Name</label>
                  <input type="text" class="form-control" value="Reka" />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    value="reka@gmail.com"
                  />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Phone</label>
                  <input type="text" class="form-control" value="9876543210" />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Course</label>
                  <input
                    type="text"
                    class="form-control"
                    value="Frontend Development"
                  />
                </div>
              </div>

              <button class="btn btn-success mt-3">Save Changes</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Collapse Section -->
      <div class="mt-4 text-center">
        <button
          class="btn btn-secondary"
          data-bs-toggle="collapse"
          data-bs-target="#moreInfo"
        >
          Show More Details
        </button>

        <div class="collapse mt-3" id="moreInfo">
          <div class="card card-body w-50 mx-auto">
            Student enrolled in 5 courses and completed 3 successfully.
          </div>
        </div>
      </div>

      <!-- Course Table -->
      <div class="card shadow w-75 mx-auto mt-5">
        <div class="card-header bg-success text-white">Course History</div>

        <div class="card-body">
          <table class="table table-bordered table-hover text-center">
            <thead>
              <tr>
                <th>Course</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>HTML</td>
                <td>Completed</td>
              </tr>

              <tr>
                <td>CSS</td>
                <td>Completed</td>
              </tr>

              <tr>
                <td>JavaScript</td>
                <td>Learning</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="editModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Profile</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <input type="text" class="form-control mb-3" placeholder="Name" />

            <input type="email" class="form-control" placeholder="Email" />
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Close
            </button>

            <button class="btn btn-success">Save</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Admin Dashboard</title>
  </head>
  <body class="bg-gray-100">
    <div class="grid md:grid-cols-[220px_1fr] min-h-screen">
      <!-- Sidebar -->
      <aside class="bg-blue-900 text-white p-6">
        <h1 class="text-2xl font-bold mb-8">Admin Panel</h1>

        <ul class="space-y-4">
          <li>
            <a href="#" class="block p-3 bg-blue-700 rounded"> Dashboard </a>
          </li>

          <li>
            <a href="#" class="block p-3 hover:bg-blue-700 rounded">
              Courses
            </a>
          </li>

          <li>
            <a href="#" class="block p-3 hover:bg-blue-700 rounded">
              Reports
            </a>
          </li>

          <li>
            <a href="#" class="block p-3 hover:bg-blue-700 rounded">
              Settings
            </a>
          </li>
        </ul>
      </aside>

      <!-- Main Content -->
      <main class="p-6">
        <h2 class="text-3xl font-bold mb-6">Dashboard</h2>

       
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
          <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="text-gray-500">Students</h3>
            <p class="text-3xl font-bold">1200</p>
          </div>

          <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="text-gray-500">Courses</h3>
            <p class="text-3xl font-bold">48</p>
          </div>

          <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="text-gray-500">Reports</h3>
            <p class="text-3xl font-bold">35</p>
          </div>

          <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="text-gray-500">Revenue</h3>
            <p class="text-3xl font-bold">Rs 8,500</p>
          </div>
        </div>

        <!-- Charts Placeholder -->
        <div class="grid md:grid-cols-2 gap-6 mb-8">
          <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="font-semibold mb-4">Course Enrollments</h3>

            <div
              class="h-56 bg-gray-200 rounded flex items-center justify-center"
            >
              Chart
            </div>
          </div>

          <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="font-semibold mb-4">Revenue Overview</h3>

            <div
              class="h-56 bg-gray-200 rounded flex items-center justify-center"
            >
              Chart
            </div>
          </div>
        </div>

        <!-- Recent Users Table -->
        <div class="bg-white p-6 rounded-lg shadow">
          <h3 class="text-xl font-bold mb-4">Recent Users</h3>

          <div class="overflow-x-auto">
            <table class="w-full">
              <thead>
                <tr class="bg-gray-100">
                  <th class="p-3 text-left">Name</th>
                  <th class="p-3 text-left">Course</th>
                  <th class="p-3 text-left">Status</th>
                </tr>
              </thead>

              <tbody>
                <tr class="border-b">
                  <td class="p-3">John</td>
                  <td class="p-3">HTML</td>
                  <td class="p-3 text-green-600">Active</td>
                </tr>

                <tr class="border-b">
                  <td class="p-3">Sarah</td>
                  <td class="p-3">CSS</td>
                  <td class="p-3 text-green-600">Active</td>
                </tr>

                <tr class="border-b">
                  <td class="p-3">David</td>
                  <td class="p-3">JavaScript</td>
                  <td class="p-3 text-red-600">Inactive</td>
                </tr>

                <tr>
                  <td class="p-3">Emma</td>
                  <td class="p-3">React</td>
                  <td class="p-3 text-green-600">Active</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>

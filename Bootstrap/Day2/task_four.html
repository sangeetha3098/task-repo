<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Profile Card</title>
  </head>
  <body>
    <div class="bg-gray-100 flex justify-center items-center h-screen">
      <!-- Profile Card -->
      <div
        class="bg-white shadow-xl rounded-lg p-6 flex flex-col items-center w-72"
      >
        <!-- Profile Image -->
        <img
          src="../assets/image/falls.jpg"
          alt="Profile"
          class="w-24 h-24 rounded-full border-4 border-blue-500"
        />

        <!-- Name -->
        <h2 class="text-2xl font-bold mt-4 text-gray-800">Sangeetha</h2>

        <!-- Role -->
        <p class="text-gray-500 mt-1">Frontend Developer</p>

        <!-- Follow Button -->
        <button
          class="mt-5 bg-blue-500 text-white px-5 py-2 rounded-lg hover:bg-blue-700"
        >
          Follow
        </button>
      </div>
    </div>
  </body>
</html>

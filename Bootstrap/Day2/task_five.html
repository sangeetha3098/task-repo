<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Image Gallery</title>
  </head>
  <body>
    <div class="bg-blue-100 p-8">
      <h1 class="text-3xl font-bold text-center text-purple-600 mb-8">
        Image Gallery
      </h1>

      <!-- Gallery Grid -->
      <div class="grid grid-cols-3 gap-4">
        
        <div class="overflow-hidden rounded-lg">
          <img
            src="../assets/image/bridge.jpg"
            class="w-full h-64 object-cover rounded-lg hover:scale-110 transition duration-300"
          />
        </div>

        <div class="overflow-hidden rounded-lg">
          <img
            src="../assets/image/cave.jpg"
            class="w-full h-64 object-cover rounded-lg hover:scale-110 transition duration-300"
          />
        </div>

        <div class="overflow-hidden rounded-lg">
          <img
            src="../assets/image/falls.jpg"
            class="w-full h-64 object-cover rounded-lg hover:scale-110 transition duration-300"
          />
        </div>

        <div class="overflow-hidden rounded-lg">
          <img
            src="../assets/image/mountain.jpg"
            class="w-full h-64 object-cover rounded-lg hover:scale-110 transition duration-300"
          />
        </div>

        <div class="overflow-hidden rounded-lg">
          <img
            src="../assets/image/sea_view.jpg"
            class="w-full h-64 object-cover rounded-lg hover:scale-110 transition duration-300"
          />
        </div>

        <div class="overflow-hidden rounded-lg">
          <img
            src="../assets/image/forest_one.jpg"
            class="w-full h-64 object-cover rounded-lg hover:scale-110 transition duration-300"
          />
        </div>

      </div>
    </div>
  </body>
</html>

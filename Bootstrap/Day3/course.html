<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Cards</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>

<div class="container py-5">
  <h2 class="text-center mb-4">Popular Courses</h2>

  <div class="row g-4">

    <!-- Card 1 -->
    <div class="col-12 col-md-6 col-lg-4 col-xl-3">
      <div class="card h-100 shadow">
        <img src="../assets/image/sea_view.jpg" class="card-img-top" alt="Course">
        <div class="card-body">
          <h5 class="card-title">HTML & CSS</h5>
          <p class="card-text">Trainer: John</p>
          <h6 class="text-success">₹999</h6>
          <button class="btn btn-primary w-100">Enroll Now</button>
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="col-12 col-md-6 col-lg-4 col-xl-3">
      <div class="card h-100 shadow">
        <img src="../assets/image/bridge.jpg" class="card-img-top" alt="Course">
        <div class="card-body">
          <h5 class="card-title">JavaScript</h5>
          <p class="card-text">Trainer: Sarah</p>
          <h6 class="text-success">₹1499</h6>
          <button class="btn btn-primary w-100">Enroll Now</button>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="col-12 col-md-6 col-lg-4 col-xl-3">
      <div class="card h-100 shadow">
        <img src="../assets/image/bridge.jpg" class="card-img-top" alt="Course">
        <div class="card-body">
          <h5 class="card-title">React JS</h5>
          <p class="card-text">Trainer: David</p>
          <h6 class="text-success">₹1999</h6>
          <button class="btn btn-primary w-100">Enroll Now</button>
        </div>
      </div>
    </div>

    <!-- Card 4 -->
    <div class="col-12 col-md-6 col-lg-4 col-xl-3">
      <div class="card h-100 shadow">
        <img src="../assets/image/bridge.jpg" class="card-img-top" alt="Course">
        <div class="card-body">
          <h5 class="card-title">Bootstrap</h5>
          <p class="card-text">Trainer: Priya</p>
          <h6 class="text-success">₹799</h6>
          <button class="btn btn-primary w-100">Enroll Now</button>
        </div>
      </div>
    </div>

    <!-- Card 5 -->
    <div class="col-12 col-md-6 col-lg-4 col-xl-3">
      <div class="card h-100 shadow">
        <img src="../assets/image/sea_view.jpg" class="card-img-top" alt="Course">
        <div class="card-body">
          <h5 class="card-title">Python</h5>
          <p class="card-text">Trainer: Michael Brown</p>
          <h6 class="text-success">₹2499</h6>
          <button class="btn btn-primary w-100">Enroll Now</button>
        </div>
      </div>
    </div>

    <!-- Card 6 -->
    <div class="col-12 col-md-6 col-lg-4 col-xl-3">
      <div class="card h-100 shadow">
        <img src="../assets/image/sea_view.jpg" class="card-img-top" alt="Course">
        <div class="card-body">
          <h5 class="card-title">UI/UX Design</h5>
          <p class="card-text">Trainer: Sophia Green</p>
          <h6 class="text-success">₹1799</h6>
          <button class="btn btn-primary w-100">Enroll Now</button>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>

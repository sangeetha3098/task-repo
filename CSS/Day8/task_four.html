<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <link rel="stylesheet" href="../assets/css/pseudo_four.css" />
  </head>
  <body>
    <div class="gallery-container">
      <h1 class="gallery-title">Image Gallery</h1>

      <div class="image-gallery-grid">
        <div class="gallery-item">
          <img src="../assets/image/gallery/sea.jpg" alt="Sea" />
        </div>

        <div class="gallery-item">
          <img src="../assets/image/gallery/bridge.jpg" alt="Bridge" />
        </div>

        <div class="gallery-item">
          <img src="../assets/image/gallery/forest.jpg" alt="Forest" />
        </div>

        <div class="gallery-item">
          <img src="../assets/image/gallery/forest_one.jpg" alt="Forest One" />
        </div>

        <div class="gallery-item">
          <img src="../assets/image/gallery/sea_view.jpg" alt="Sea View" />
        </div>

        <div class="gallery-item">
          <img src="../assets/image/gallery/vintage.jpg" alt="Vintage" />
        </div>

        <div class="gallery-item">
          <img src="../assets/image/gallery/falls.jpg" alt="Falls" />
        </div>

        <div class="gallery-item">
          <img src="../assets/image/gallery/path.jpg" alt="Path" />
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thumbnail</title>
    <link rel="stylesheet" href="../assets/thumbnail.css" />
  </head>
  <body>
    <div class="main">
      <div class="submain">
        <div class="image-section">
          <h3>Thumbnail</h3>

          <div class="image">
            <img src="../assets/image/thumbnail.png" alt="thumbnail image" />
          </div>
        </div>

        <div class="content">
         <h5>
           <span style="font-weight: bold;color: black;"> Note: </span>This image tile will be used to represent this course across
            all your academy's landing pages.
          </h5>
          <p>Allowed formats: ".jpg, .png, .jpeg, .gif, .webp, .sketch"</p>

          <p>Preferred minimum resolution: 480 × 270</p>

          <p>Maximum size: 150kb</p>
          <button>Add Image</button>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Grid Gallery</title>
    <link rel="stylesheet" href="../assets/grid_gallery.css" />
  </head>
  <body>
    <div class="gallery-container">
      <h1 class="gallery-title">Image Gallery</h1>

      <div class="image-gallery-grid">
        <div class="gallery-item">
          <img src="../assets/image/gallery/sea.jpg" alt="Gallery Image 1" />
        </div>

        <div class="gallery-item">
          <img src="../assets/image/gallery/bridge.jpg" alt="Gallery Image 2" />
        </div>

        <div class="gallery-item">
          <img src="../assets/image/gallery/forest.jpg" alt="Gallery Image 3" />
        </div>

        <div class="gallery-item">
          <img
            src="../assets/image/gallery/forest_one.jpg"
            alt="Gallery Image 4"
          />
        </div>

        <div class="gallery-item">
          <img
            src="../assets/image/gallery/sea_view.jpg"
            alt="Gallery Image 5"
          />
        </div>

        <div class="gallery-item">
          <img
            src="../assets/image/gallery/vintage.jpg"
            alt="Gallery Image 6"
          />
        </div>
        <div class="gallery-item">
          <img src="../assets/image/gallery/falls.jpg" alt="Gallery Image 7" />
        </div>
        <div class="gallery-item">
          <img src="../assets/image/gallery/path.jpg" alt="Gallery Image 8" />
        </div>
      </div>
    </div>
  </body>
</html>

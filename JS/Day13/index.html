<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body>
    <div class="h-screen flex flex-col justify-center items-center gap-4">
      <div class="p-4">
        <button
          onclick="show()"
          class="bg-blue-500 text-white px-4 py-2 rounded"
        >
          Click
        </button>

        <div
          id="content"
          class="hidden flex h-24 p-10 justify-center items-center mt-4 bg-red-600 text-white rounded"
        >
          This is a text to be shown when the button is clicked
        </div>
      </div>

      <form id="data" onsubmit="handleChange(event)">
        <input
          type="text"
          id="name"
          class="border border-black p-2 rounded"
          placeholder="Enter your name"
        />

        <input
          type="submit"
          value="Check"
          class="border rounded bg-gray-100 p-2 cursor-pointer"
        />
      </form>
    </div>

    <script>
      const show = () => {
        const data = document.getElementById("content");

        if (data.style.display === "flex") {
          data.style.display = "none";
        } else {
          data.style.display = "flex";
        }
      };

      const handleChange = (e) => {
        e.preventDefault();

        const userName = document.getElementById("name").value;

        if (userName === "") {
          alert("Fill the Input");
          return;
        }

        const data = [];
        data.push(userName);

        console.log(data);

        document.getElementById("data").reset();
      };
    </script>
  </body>
</html>

  // Question 1

  // Create a function called counter() that:

  // Starts with count = 0
  // Returns another function
  // Every time the returned function is called, increase count by 1 and print it

  // Expected Output

  // let countValue = counter();

  // countValue(); // 1
  // countValue(); // 2

  const counter = () => {
    let count = 0;
    const incre = () => {
      count++;

    };

  };

  let countValue = counter();
  countValue();

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-center">

    <div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-3xl">

        <h1 class="text-3xl font-bold text-center text-blue-600 mb-8">
            User Registration
        </h1>

        <form onsubmit="userData(event)" class="space-y-5">

            <div>
                <label class="block mb-2 font-semibold text-gray-700">
                    Enter Name
                </label>
                <input
                    type="text"
                    id="name"
                    class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-blue-500"
                    placeholder="Enter your name"
                >
            </div>

            <div>
                <label class="block mb-2 font-semibold text-gray-700">
                    Enter Email
                </label>
                <input
                    type="email"
                    id="email"
                    class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-blue-500"
                    placeholder="Enter your email"
                >
            </div>

            <div>
                <label class="block mb-2 font-semibold text-gray-700">
                    Enter Mobile
                </label>
                <input
                    type="number"
                    id="mobile"
                    class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-blue-500"
                    placeholder="Enter your mobile number"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
            >
                Register
            </button>

        </form>

        <div id="tableContainer" class="hidden mt-10 overflow-x-auto">

            <table class="w-full border border-gray-300 border-collapse">

                <thead class="bg-blue-600 text-white">
                    <tr>
                        <th class="border border-gray-300 p-3">Name</th>
                        <th class="border border-gray-300 p-3">Email</th>
                        <th class="border border-gray-300 p-3">Mobile</th>
                    </tr>
                </thead>

                <tbody id="tableData"></tbody>

            </table>

        </div>

    </div>

    <script>
        const dataBase = [];

        const userData = (e) => {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const mobile = document.getElementById("mobile").value.trim();

            if (name === "" || email === "" || mobile === "") {
                alert("Please fill all fields");
                return;
            }

            const data = {
                name,
                email,
                mobile
            };

            dataBase.push(data);

            localStorage.setItem("data", JSON.stringify(dataBase));

            document.getElementById("tableContainer").classList.remove("hidden");

            const userShow = document.getElementById("tableData");

            userShow.innerHTML = "";

            dataBase.forEach((user) => {
                userShow.innerHTML += `
                    <tr class="hover:bg-blue-50">
                        <td class="border border-gray-300 p-3">${user.name}</td>
                        <td class="border border-gray-300 p-3">${user.email}</td>
                        <td class="border border-gray-300 p-3">${user.mobile}</td>
                    </tr>
                `;
            });
        };
    </script>

</body>
</html>

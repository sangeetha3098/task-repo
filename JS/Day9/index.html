  // Create a banking closure.

  const bankClosure = (initialBalance) => {
    let initBal = initialBalance;

    return {
      deposit: (amount) => {
        initBal += amount;
      },
      withdraw: (amount) => {
        initBal -= amount;
      },
      checkBalance: () => {

      },
    };
  };

  myAccount.withdraw(500);

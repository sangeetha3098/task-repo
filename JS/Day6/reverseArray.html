<script>
    let heros = ["Vijay","Ajith","Dhanush","Str","Sk"]

    let reverse = []

    let index=0;

    for(let i=heros.length-1;i>=0;i--){
        
        reverse[index]=heros[i]
        index++
        // console.log(heros[i])
    }
    console.log("Reversed heros name are",reverse);
    
</script>
